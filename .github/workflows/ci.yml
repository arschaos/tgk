name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - uses: Swatinem/rust-cache@v2

    - name: Format check
      run: cargo fmt --all --check

    - name: Clippy
      run: cargo clippy --workspace --release -- -D warnings

    - name: Test
      run: cargo test --workspace --release

    - name: Build
      run: cargo build --workspace --release

    - name: Run
      run: cargo run --release -- execute

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: tgk-${{ matrix.os }}
        path: target/release/tgk*
        if-no-files-found: error

  docker:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            tag: tgk-amd64:latest
          - platform: linux/arm64
            tag: tgk-arm64:latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build (${{ matrix.platform }})
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ matrix.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run (${{ matrix.platform }})
        run: |
          docker run --rm --platform ${{ matrix.platform }} ${{ matrix.tag }} --version
          out="$(docker run --rm --platform ${{ matrix.platform }} ${{ matrix.tag }} execute)"
          [ "$out" = "Hello World" ]

      - name: Run non-root (${{ matrix.platform }})
        run: docker run --rm --platform ${{ matrix.platform }} --user tgk ${{ matrix.tag }} execute